server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: training-question-bank
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:question_bank}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:tqb}
    password: ${DB_PASSWORD:tqb123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        # 不使用字节码代理(规避 JDK 版本兼容问题); 实体关联均为 EAGER, 不影响功能
        bytecode:
          provider: none
    show-sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai

app:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖(长度 >= 32 字符)
    secret: ${JWT_SECRET:TrainingQuestionBankSystem-Default-Jwt-Secret-2026-DevOnly}
    expire-hours: ${JWT_EXPIRE_HOURS:72}

# 大模型出题配置 ------------------------------------------------------------
# provider: auto | qianfan | mock
#   auto  : 配置了 QIANFAN_API_KEY 走千帆大模型, 否则自动降级为本地模拟生成(便于无 Key 环境演示)
#   qianfan: 强制调用百度千帆 ModelBuilder(OpenAI 兼容 v2 接口)
#   mock  : 强制本地模拟生成
ai:
  provider: ${AI_PROVIDER:auto}
  qianfan:
    base-url: https://qianfan.baidubce.com/v2
    api-key: ${QIANFAN_API_KEY:}
    model: ${QIANFAN_MODEL:ernie-4.0-turbo-8k}
    temperature: ${QIANFAN_TEMPERATURE:0.6}
    max-tokens: 4096
    timeout-seconds: 180

# 首次启动数据初始化 ----------------------------------------------------------
seed:
  enabled: true                       # 首次启动(空库)时自动导入 data 目录题库并创建默认账号
  data-file: classpath:seed/dangshi_150.json
